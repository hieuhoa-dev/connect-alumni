<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D22" />
      <stop offset="50%" stop-color="#124D28" />
      <stop offset="100%" stop-color="#1B7A3E" />
    </linearGradient>
    <radialGradient id="sun" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F28A1B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F28A1B" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#sun)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Stylized Pine Tree / Dalat Mountain Lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 0 520 Q 300 420 600 490 T 1200 450 L 1200 630 L 0 630 Z" fill="#0A1F14" opacity="0.4" />
    <path d="M 0 560 Q 400 480 800 550 T 1200 510 L 1200 630 L 0 630 Z" fill="#06140D" opacity="0.6" />
  </g>

  <!-- Emblem Center -->
  <g transform="translate(600, 260)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="#FFFFFF" fill-opacity="0.08" stroke="#F28A1B" stroke-width="2" stroke-opacity="0.4" />
    <circle r="56" fill="#0F3D22" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />

    <!-- Pine Tree Icon -->
    <path d="M 0 -32 L -20 0 L -8 0 L -24 24 L 24 24 L 8 0 L 20 0 Z" fill="#4ADE80" opacity="0.9" />
    <rect x="-3" y="24" width="6" height="10" fill="#F28A1B" />
  </g>

  <!-- Text -->
  <text x="600" y="380" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    TRƯỜNG ĐẠI HỌC ĐÀ LẠT
  </text>
  <text x="600" y="415" text-anchor="middle" font-family="'Geist Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#CFE8D5" letter-spacing="3">
    MẠNG LƯỚI CỰU SINH VIÊN &amp; SINH VIÊN (DLU)
  </text>
</svg>